<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Admin console for Intyoza, the youth sexual and reproductive health platform." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Intyoza Admin</title>
    <!-- Applies the saved light/dark choice before first paint, so the page never flashes. -->
    <script>
      try{var t=localStorage.getItem('intyoza.theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
